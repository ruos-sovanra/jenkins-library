# roles/rke2/tasks/install.yml
---
- name: Add RKE2 repository
  ansible.builtin.yum_repository:
    name: rke2
    description: RKE2 Repository
    baseurl: https://rpm.rancher.io/rke2/stable/common/centos/7/noarch
    gpgcheck: yes
    gpgkey: https://rpm.rancher.io/public.key

- name: Install RKE2
  ansible.builtin.yum:
    name: rke2-server
    state: present

- name: Enable and start RKE2 service
  ansible.builtin.systemd:
    name: rke2-server
    enabled: yes
    state: started

- name: Configure RKE2
  ansible.builtin.copy:
    dest: /etc/rancher/rke2/config.yaml
    content: |
      write-kubeconfig-mode: "0644"
      tls-san:
        - "{{ domain }}"
      node-name: "{{ inventory_hostname }}"
      cni: "canal"
      disable:
        - rke2-ingress-nginx

- name: Restart RKE2 service to apply configuration
  ansible.builtin.systemd:
    name: rke2-server
    state: restarted

- name: Wait for RKE2 to be ready
  ansible.builtin.wait_for:
    port: 6443
    host: "{{ inventory_hostname }}"
    state: started
    delay: 30
    timeout: 300